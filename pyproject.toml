[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kernelport"
version = "0.1.0.dev0"
description = "Bring CUDA-only kernels to Mac, AMD, browsers, and CPU, with proof they are correct."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "kernelport contributors" }]
keywords = ["cuda", "triton", "metal", "webgpu", "hip", "mcp", "gpu", "kernels"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Compilers",
]
# Core: MCP server, CLI, analyzer, reporting, skills, setup.
# Must NOT pull in torch or any GPU package.
dependencies = [
    "mcp>=2.0",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
]

[project.optional-dependencies]
# torch CPU is enough to run references. For CUDA builds of torch, install from
# the official PyTorch index first (see docs/installation.md).
ref = ["torch>=2.4"]
cuda = ["torch>=2.7", "cupy-cuda12x>=13", "nvidia-cuda-nvrtc-cu12", "nvidia-cuda-runtime-cu12"]
triton = [
    "torch>=2.7",
    "triton-windows>=3.3; sys_platform == 'win32'",
    "triton>=3.3; sys_platform == 'linux'",
]
metal = ["torch>=2.4", "mlx>=0.22; sys_platform == 'darwin'"]
webgpu = ["torch>=2.4", "wgpu>=0.30"]
cpu = ["torch>=2.4", "numba>=0.60"]
hip = ["torch>=2.4"]
agent = ["anthropic>=0.40"]
dev = ["pytest>=8"]
all = ["kernelport[ref,cuda,triton,metal,webgpu,cpu,hip,agent,dev]"]

[project.scripts]
kernelport = "kernelport.cli:app"

[project.urls]
Homepage = "https://github.com/PS12007/kernelport"

[tool.hatch.build.targets.wheel]
packages = ["kernelport"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "kernelport/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU (skipped otherwise)",
]
